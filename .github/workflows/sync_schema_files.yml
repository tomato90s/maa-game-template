name: sync-schema-files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download MaaFramework JSON schemas
        shell: bash
        run: |
          mkdir -p deps/tools
          base_url="https://raw.githubusercontent.com/MaaXYZ/MaaFramework/main/tools"

          curl -fsSL "$base_url/interface.schema.json" -o deps/tools/interface.schema.json
          curl -fsSL "$base_url/interface_config.schema.json" -o deps/tools/interface_config.schema.json
          curl -fsSL "$base_url/interface_import.schema.json" -o deps/tools/interface_import.schema.json
          curl -fsSL "$base_url/pipeline.schema.json" -o deps/tools/pipeline.schema.json
          curl -fsSL "$base_url/custom.recognition.schema.json" -o deps/tools/custom.recognition.schema.json
          curl -fsSL "$base_url/custom.action.schema.json" -o deps/tools/custom.action.schema.json

      - name: Commit schema updates
        shell: bash
        run: |
          if git diff --quiet -- deps/tools; then
            echo "No schema changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deps/tools/*.schema.json
          git commit -m "chore: sync MaaFramework schema files"
          git push
