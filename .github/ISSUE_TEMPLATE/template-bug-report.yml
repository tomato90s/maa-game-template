name: Template bug report
description: Report a problem with this template repository.
title: "[Template Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for bugs in the template itself, such as broken CI, bad docs, or broken default project structure.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is broken?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the exact commands or GitHub Actions workflow run.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, Python version, and MaaFramework version if relevant.
